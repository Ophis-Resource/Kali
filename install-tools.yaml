                  displayName: "Install wordlist"

      # GIT CLONE & Sn1per install (keeps your previous approach)
      - deployment: Install_Sn1per
        displayName: "Clone & Install Sn1per"
        environment:
          name: Kali
          resourceType: virtualMachine
        dependsOn: Prepare
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Cloning Sn1per and running installer..."
                    mkdir -p /home/azureuser/github
                    cd /home/azureuser/github
                    if [ -d "Sn1per" ]; then
                      echo "Sn1per already cloned, pulling latest..."
                      cd Sn1per && git pull || true
                    else
                      git clone https://github.com/1N3/Sn1per.git
                      cd Sn1per
                    fi
                    printf '\n' | sudo bash install.sh -y || echo "Sn1per installer exited with code $?"
                  displayName: "Clone & run Sn1per installer"