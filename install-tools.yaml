trigger:
  - main

stages:
  - stage: InstallTools
    displayName: "Install Tools on Kali VM"
    jobs:

      # PREP JOB: update/upgrade once
      - deployment: Prepare
        displayName: "Prepare VM (apt update/upgrade)"
        environment:
          name: Kali
          resourceType: virtualMachine
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Updating APT repositories and upgrading..."
                    sudo apt update -y
                    sudo apt-get update -y
                    sudo apt-get upgrade -y
                    sudo apt upgrade -y
                    echo "Prepare step done."
                  displayName: "APT update & upgrade"

      # Single-package install jobs (each depends on Prepare)
      - deployment: Install_whois
        displayName: "Install whois"
        environment:
          name: Kali
          resourceType: virtualMachine
        dependsOn: Prepare
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    sudo apt install whois -y
                  displayName: "Install whois"

      - deployment: Install_bind9_dnsutils
